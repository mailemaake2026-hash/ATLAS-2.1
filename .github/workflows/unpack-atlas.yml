name: ATLAS 2.1 Automatic Extraction and Deployment

on:
  push:
    paths:
      - 'ATLAS_2_1_GitHub_Ready.zip'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: atlas-deployment
  cancel-in-progress: false

jobs:
  extract-and-deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify ZIP archive
        run: |
          if [ ! -f ATLAS_2_1_GitHub_Ready.zip ]; then
            echo "ERROR: ATLAS ZIP not found"
            exit 1
          fi

          unzip -tq ATLAS_2_1_GitHub_Ready.zip

          echo "ZIP verification successful"

      - name: Extract ATLAS 2.1
        run: |
          mkdir -p /tmp/atlas

          unzip -q ATLAS_2_1_GitHub_Ready.zip \
            -d /tmp/atlas

          test -f /tmp/atlas/ATLAS_2_1/index.html

          echo "ATLAS extracted successfully"

      - name: Replace old application
        run: |
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            -exec rm -rf {} +

          rsync -a --exclude='.github/' \
            /tmp/atlas/ATLAS_2_1/ ./

          echo "Application replacement successful"

      - name: Verify application
        run: |
          test -f index.html
          test -f app.js
          test -f styles.css
          test -f strategy-engine.js
          test -f manifest.webmanifest
          test -d backend
          test -d assets
          test -d tests

          echo "Application files verified"

      - name: Run ATLAS tests
        run: |
          npm test

          npm run check

      - name: Save extracted application
        run: |
          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          rm -f ATLAS_2_1_GitHub_Ready.zip

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Deploy ATLAS 2.1 Command Deck"

            git push
          fi

          echo "ATLAS source files saved"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy ATLAS 2.1
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Confirm deployment
        run: |
          echo "================================"
          echo "ATLAS 2.1 DEPLOYMENT SUCCESSFUL"
          echo "================================"

          echo "${{ steps.deployment.outputs.page_url }}"
