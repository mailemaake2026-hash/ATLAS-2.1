name: ATLAS 2.1 Automatic Deployment

on:
  push:
    paths:
      - 'ATLAS_2_1_GitHub_Ready.zip'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: atlas-deployment
  cancel-in-progress: true

jobs:
  extract-and-deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify ATLAS ZIP
        run: |
          test -f ATLAS_2_1_GitHub_Ready.zip

          unzip -tq ATLAS_2_1_GitHub_Ready.zip

          echo "ZIP verified successfully"

      - name: Extract ATLAS
        run: |
          mkdir -p /tmp/atlas

          unzip -q ATLAS_2_1_GitHub_Ready.zip \
            -d /tmp/atlas

          test -f /tmp/atlas/ATLAS_2_1/index.html

          echo "ATLAS extracted successfully"

      - name: Verify application
        run: |
          cd /tmp/atlas/ATLAS_2_1

          test -f index.html
          test -f app.js
          test -f styles.css
          test -f strategy-engine.js
          test -d backend
          test -d assets

          echo "Application verification successful"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload ATLAS website
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/atlas/ATLAS_2_1

      - name: Deploy ATLAS 2.1
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment confirmation
        run: |
          echo "================================"
          echo "ATLAS 2.1 DEPLOYED SUCCESSFULLY"
          echo "================================"

          echo "${{ steps.deployment.outputs.page_url }}"
