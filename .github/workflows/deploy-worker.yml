name: Deploy ATLAS Worker

on:
  workflow_dispatch:
  push:
    paths:
      - "ATLAS_2_1_GitHub_Ready.zip"
      - ".github/workflows/deploy-worker.yml"

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Extract ATLAS ZIP
        run: |
          mkdir -p atlas-source
          unzip -q "ATLAS_2_1_GitHub_Ready.zip" -d atlas-source
          echo "Extracted ATLAS files:"
          find atlas-source -maxdepth 5 -type f

      - name: Insert D1 database ID
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          CONFIG="atlas-source/ATLAS_2_1/backend/wrangler.toml"

          if [ -z "$D1_DATABASE_ID" ]; then
            echo "D1_DATABASE_ID secret is missing."
            exit 1
          fi

          if ! grep -q "REPLACE_WITH_YOUR_D1_DATABASE_ID" "$CONFIG"; then
            echo "Database ID placeholder was not found."
            exit 1
          fi

          sed -i \
            "s/REPLACE_WITH_YOUR_D1_DATABASE_ID/$D1_DATABASE_ID/g" \
            "$CONFIG"

          echo "D1 database ID inserted."

      - name: Deploy ATLAS Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config atlas-source/ATLAS_2_1/backend/wrangler.toml
